[tox]
envlist =
    py314
    py313
    py312
    py311
    py310
    coverage
    lint
    mypy

[testenv]
extras =
    test
commands =
    pytest {posargs}

[testenv:coverage]
commands =
    coverage erase
    coverage run -m pytest tests
    coverage report -m  --fail-under=100

[testenv:lint]
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:mypy]
deps =
    mypy
commands =
    mypy --strict src {posargs}

[flake8]
max-line-length = 88
# clashes with black
ignore = E231

[isort]
known_third_party = click,httpx,pykeepass,pytest,setuptools

[gh-actions]
python =
    3.10: py310, coverage
    3.11: py311, mypy
    3.12: py312, lint
    3.13: py313
    3.14: py314
